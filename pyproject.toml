[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-text2sql-finetuning-lab"
version = "0.3.0"
description = "Executable Text2SQL evaluation with one-GPU Nemotron Nano and advanced Lightning LoRA labs"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"] # direct-entry scripts bootstrap the src layout; notebook sources are prose-heavy
