schema_version: 1
name: Nemotron Executable Text2SQL Fine-Tuning Workshop
description: >-
  Five evidence-led labs: compare hosted Lightning and Ultra, establish a
  profile-matched local BF16 baseline, fine-tune Nano 9B v2 on one GPU for the
  practical workshop, preserve Lightning 3.5 as an advanced two-GPU exercise,
  and inspect true full-parameter SFT as a design-only handoff.

source:
  type: public_git_repository
  repository_url: https://github.com/siddBanPsu/nemotron-fine-tuning

default_hardware:
  gpu: 1x NVIDIA RTX PRO 6000 Blackwell Server Edition 96 GB
  host_memory_gb: 128
  disk_gb: 200
  reason: >-
    This GPU/provider path completed the NeMo 26.08 container and CUDA smoke
    test with host driver 595.91.07 using forward compatibility. That proves
    startup, not the under-one-hour training target. The default
    nano9b_workshop profile still uses Megatron-Bridge's pinned one-H100 BF16
    PEFT recipe and requires a complete rehearsal on the selected SKU.

hardware_profiles:
  - label: Recommended one-GPU workshop
    gpu: 1x NVIDIA RTX PRO 6000 Blackwell Server Edition 96 GB
    host_memory_gb: 128
    disk_gb: 200
    model_profile: nano9b_workshop
    notebooks: [01, 02, 03, 05-design]
    status: >-
      WORKSHOP_MODE defaults to true and uses 1,024 direct-SQL rows with at
      most 16 packed steps. Setting it false selects a separately namespaced
      extended run with 2,048 rows and at most 32 steps. The intended warm-cache
      duration is under one hour, but this is an acceptance target, not a
      measured runtime guarantee, until rehearsed on the chosen SKU.
  - label: Conditional 80 GB data-center path
    gpu: 1x NVIDIA A100 80 GB or 1x NVIDIA H100 80 GB
    host_memory_gb: 128
    disk_gb: 200
    model_profile: nano9b_workshop
    notebooks: [01, 02, 03, 05-design]
    status: >-
      Use only when the provider/base image supplies NVIDIA driver 580.65.06
      or newer. GPU name and VRAM do not determine the driver: an observed
      Brev A100 80 GB image with driver 565.57.01 cannot start NeMo 26.08.
  - label: Experimental 48 GB Nano path
    gpu: 1x NVIDIA L40S 48 GB
    host_memory_gb: 128
    disk_gb: 200
    model_profile: nano9b_workshop
    notebooks: [01, 02, 03, 05-design]
    status: >-
      The software gate permits this capacity, but the pinned recipe is a
      one-H100 recipe. Rehearse memory headroom and runtime before a workshop.
  - label: Advanced Lightning two-GPU path
    gpu: 2x NVIDIA A100 80 GB or 2x NVIDIA H100 80 GB
    host_memory_gb: 192
    disk_gb: 300
    model_profile: lightning35_advanced
    notebooks: [01, 02, 04, 05-design]
    status: >-
      Uses TP1/EP2, 4,096 rows, and at most 64 steps. The measured warm-cache
      2xA100 run took 6 h 49 min for Notebook 04's train, merge, and evaluation.
      It is not the one-hour workshop path.
  - label: External Lightning full-SFT reference
    gpu: 16x NVIDIA H100 80 GB verified-reference gate
    host_memory_gb: 512
    disk_gb: 500
    model_profile: lightning35_advanced
    notebooks: [05-design, scripts/train_full.py]
    status: >-
      Notebook 05 launches nothing. The full-SFT driver is hardware-gated to
      NVIDIA's verified 4K reference of 16x H100 80 GB TP2/EP8.

software:
  mode: VM
  container: nvcr.io/nvidia/nemo:26.08
  minimum_nvidia_driver: "580.65.06 for CUDA 13.x minor compatibility; 610.43.02 native"
  python_version: "3.12"
  setup_script_file: launchable/setup.sh
  custom_jupyter: true
  jupyter_port: 8889
  jupyter_default_url: /lab/tree/notebooks/01_cloud_api_baseline.ipynb
  compatibility_note: >-
    Select the VM image by driver as well as GPU. CUDA 13.x requires driver
    580.65.06+ for minor-version compatibility; the lifecycle script cannot
    replace a kernel driver because activation requires a reboot. NVIDIA's
    cuda-compat forward-compatibility package cannot go below that floor
    either, and covers only data-center GPUs and select NGC-Server-Ready RTX
    SKUs. Screen a candidate instance with launchable/check_driver.sh before
    provisioning; recover a rejected one over SSH with
    launchable/upgrade_driver.sh followed by a reboot and a setup rerun.
  preflight_script_file: launchable/check_driver.sh
  driver_recovery_script_file: launchable/upgrade_driver.sh

network:
  jupyter_authentication: >-
    Jupyter runs tokenless; authentication is handled by Brev's Secure Link
    (Pomerium SSO). The container uses host networking so no Docker NAT
    conflicts with Tailscale iptables rules.
  secure_links:
    - name: jupyter
      port: 8889
      show_as_call_to_action: true
  public_tcp_udp_ports: []

launch_parameters:
  - name: NEMOTRON_MODEL_PROFILE
    required: false
    default: nano9b_workshop
    allowed_values: [nano9b_workshop, lightning35_advanced]
    description: >-
      Selects the model prefetched by setup and the default in Notebook 02.
      Notebook 03 is always Nano; Notebook 04 is always Lightning.
  - name: NEMOTRON_PREFETCH_MODEL
    required: false
    default: "0"
    allowed_values: ["0", "1"]
    description: >-
      Set to 1 before a scheduled workshop to download and convert the selected
      BF16 model; 0 opens the API notebook without waiting.
  - name: NEMOTRON_DRIVER_WAIT_SECONDS
    required: false
    default: "300"
    description: >-
      Seconds the on-create script waits for nvidia-smi to answer before
      failing. A freshly created VM often finishes loading its GPU driver after
      the lifecycle service starts; the gate retries instead of crashing.
  - name: NEMOTRON_JUPYTER_PORT
    required: false
    default: "8889"
    description: >-
      Host-side Secure Link port. Container Jupyter remains on 8888; neither
      port should be exposed as unauthenticated public TCP.
  - name: NEMOTRON_REPOSITORY_REF
    required: false
    default: main
    description: Git branch, tag, or commit fetched by the lifecycle script.
  - name: NEMOTRON_REPOSITORY_MODE
    required: false
    default: auto
    allowed_values: [auto, local, bootstrap]
    description: >-
      Auto stages a clean clone under the data root when the invoking checkout
      cannot be safely bind-mounted; bootstrap always fetches the requested ref.
  - name: NEMOTRON_DATA_ROOT
    required: false
    description: >-
      Absolute persistent runtime root for checkpoints, Hugging Face files,
      BIRD databases, artifacts, caches, temporary files, and bootstrap clone.

credentials:
  nvidia_api_key:
    required_for: [01]
    handling: >-
      Prefer the process environment. Notebook 01 falls back to native input
      and clears it after connection.
  hugging_face_token:
    required: false
    handling: Optional for public model/dataset downloads; never persist in Git.
  prohibition: >-
    Never store credentials in the manifest, repository, config TOML, setup
    script, notebook output, or evaluation artifacts.

time_budget:
  counted_from: Jupyter ready with selected model and Megatron checkpoint prefetched
  notebook_01_minutes: 5-15 on CPU after the first Mini-Dev download; 50 hosted calls at 30 RPM
  notebook_02_nano: target 5-15 minutes; exact GPU and storage must be rehearsed
  notebook_03_nano: target completion within 60 minutes warm-cache; not yet measured on Brev
  notebook_04_lightning: measured 408.7 minutes on 2xA100 warm-cache; H100 timing not proven here
  notebook_05_minutes: 5-10 design-only; no full-SFT job launches

view_access: anyone_with_link
