schema_version: 1
name: Nemotron 3.5 Lightning - Executable Text2SQL Fine-Tuning
description: >-
  Four evidence-led labs: compare hosted Lightning and Ultra on BIRD Mini-Dev,
  freeze the exact local BF16 execution baseline with vLLM, fine-tune Lightning
  using NVIDIA's official Text2SQL LoRA recipe and measure the paired held-out
  gain, then inspect true full-parameter SFT as a design-only handoff.

source:
  type: public_git_repository
  repository_url: https://github.com/siddBanPsu/nemotron-fine-tuning

default_hardware:
  gpu: 1x NVIDIA H100 80 GB
  host_memory_gb: 128
  disk_gb: 300
  reason: >-
    The BF16 model is about 62 GB. NVIDIA's official one-H100 Text2SQL LoRA
    profile peaks near 79 GB at 2K sequence length; this lab uses the same
    one-GPU MTP reduction and caps the workshop at 4,096 rows / 64 steps.

hardware_profiles:
  - label: Recommended single-GPU workshop
    gpu: 1x NVIDIA H100 80 GB
    host_memory_gb: 128
    disk_gb: 300
    notebooks: [01, 02, 03, 04-design]
    status: >-
      NVIDIA measures a complete official LoRA epoch at about 60 minutes. The
      bounded workshop profile leaves time for merge and evaluation when model
      download and conversion are prefetched.
  - label: Two-GPU workshop
    gpu: 2x NVIDIA A100 80 GB or 2x NVIDIA H100 80 GB
    host_memory_gb: 192
    disk_gb: 300
    notebooks: [01, 02, 03, 04-design]
    status: >-
      Notebook 03 uses TP1/EP2. NVIDIA reports about 51 GB/GPU and 34 minutes
      for its complete two-H100 epoch; A100 timing must be measured on target.
  - label: External full-SFT reference
    gpu: 16x NVIDIA H100 80 GB verified-reference gate
    host_memory_gb: 512
    disk_gb: 500
    notebooks: [04-design, scripts/train_full.py]
    status: >-
      Notebook 04 launches nothing. The full-SFT driver is hardware-gated to
      NVIDIA's verified 4K reference of 16x H100 80 GB TP2/EP8.

software:
  mode: VM
  container: nvcr.io/nvidia/nemo:26.08
  minimum_nvidia_driver: "580.65.06 for CUDA 13.x minor compatibility; 610.43.02 native"
  python_version: "3.12"
  setup_script_file: launchable/setup.sh
  custom_jupyter: true
  jupyter_port: 8889
  jupyter_default_url: /lab/tree/notebooks/01_cloud_api_baseline.ipynb

network:
  secure_links:
    - name: jupyter
      port: 8889
      show_as_call_to_action: true
  public_tcp_udp_ports: []

launch_parameters:
  - name: NEMOTRON_PREFETCH_MODEL
    required: false
    default: "0"
    allowed_values: ["0", "1"]
    description: >-
      Set to 1 before a scheduled GPU workshop to download and convert the BF16
      model; 0 opens the API notebook without waiting for the 62 GB checkpoint.
  - name: NEMOTRON_JUPYTER_PORT
    required: false
    default: "8889"
    description: >-
      Host-side Secure Link port. Container Jupyter remains on 8888; neither
      port should be exposed as unauthenticated public TCP.
  - name: NEMOTRON_REPOSITORY_REF
    required: false
    default: main
    description: Git branch, tag, or commit fetched by the lifecycle script.
  - name: NEMOTRON_REPOSITORY_MODE
    required: false
    default: auto
    allowed_values: [auto, local, bootstrap]
    description: >-
      Auto stages a clean clone under the data root when the invoking checkout
      cannot be safely bind-mounted; bootstrap always fetches the requested ref.
  - name: NEMOTRON_DATA_ROOT
    required: false
    description: >-
      Absolute persistent runtime root for checkpoints, Hugging Face files,
      BIRD databases, artifacts, caches, temporary files, and bootstrap clone.

credentials:
  nvidia_api_key:
    required_for: [01]
    handling: >-
      Prefer the process environment. Notebook 01 falls back to native input
      and clears it after connection.
  hugging_face_token:
    required: false
    handling: Optional for public model/dataset downloads; never persist in Git.
  prohibition: >-
    Never store credentials in the manifest, repository, config TOML, setup
    script, notebook output, or evaluation artifacts.

time_budget:
  counted_from: Jupyter ready; prefetch model and converted checkpoint before participant time
  notebook_01_minutes: 5-15 on CPU after the first 800 MB Mini-Dev package download; 50 calls at 30 RPM
  notebook_02_minutes: 10-20 on one 80 GB GPU, depending on vLLM startup and storage
  notebook_03_minutes: bounded 64-step profile designed for the remaining workshop hour; exact A100/H100 timing requires target rehearsal
  notebook_04_minutes: 5-10 design-only; no full-SFT job launches

view_access: anyone_with_link
